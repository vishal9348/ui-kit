
<div
  class="ui-tabs"
  [class.ui-tabs--vertical]="resolvedOrientation() === 'vertical'"
  [class.ui-tabs--horizontal]="resolvedOrientation() === 'horizontal'"
  [class.ui-tabs--default]="resolvedVariant() === 'default'"
  [class.ui-tabs--underline]="resolvedVariant() === 'underline'"
  [class.ui-tabs--pills]="resolvedVariant() === 'pills'"
  [class.ui-tabs--sm]="resolvedSize() === 'sm'"
  [class.ui-tabs--md]="resolvedSize() === 'md'"
  [class.ui-tabs--lg]="resolvedSize() === 'lg'"
>
  <div
    class="ui-tabs__list"
    role="tablist"
    [attr.aria-label]="resolvedAriaLabel()"
    [attr.aria-orientation]="resolvedOrientation()"
  >
    @for (tab of tabs(); track tab.id; let i = $index) {
      <button
        #tabButton
        type="button"
        class="ui-tabs__tab"
        role="tab"
        [id]="tabButtonId(tab.id)"
        [class.ui-tabs__tab--active]="resolvedActiveTab() === tab.id"
        [class.ui-tabs__tab--disabled]="tab.disabled"
        [disabled]="tab.disabled"
        [attr.aria-selected]="resolvedActiveTab() === tab.id"
        [attr.aria-controls]="tabPanelId(tab.id)"
        [attr.tabindex]="resolvedActiveTab() === tab.id ? 0 : -1"
        (click)="selectTab(tab)"
        (keydown)="handleTabKeydown($event, i)"
      >
        @if (tab.icon) {
          <span class="ui-tabs__icon" aria-hidden="true">
            {{ tab.icon }}
          </span>
        }

        <span class="ui-tabs__tab-content">
          <span class="ui-tabs__label">{{ tab.label }}</span>

          @if (tab.description) {
            <span class="ui-tabs__description">
              {{ tab.description }}
            </span>
          }
        </span>
      </button>
    }
  </div>

  @for (tab of tabs(); track tab.id) {
  <div
    class="ui-tabs__panel"
    role="tabpanel"
    [id]="tabPanelId(tab.id)"
    [attr.aria-labelledby]="tabButtonId(tab.id)"
    [hidden]="resolvedActiveTab() !== tab.id"
    tabindex="0"
  >
    @if (contentFor(tab.id); as content) {
      <ng-container [ngTemplateOutlet]="content" />
    }
  </div>
}
</div>
