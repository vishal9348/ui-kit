
@if (hasSteps()) {
  <div
    class="ui-stepper"
    [class.ui-stepper-horizontal]="orientation() === 'horizontal'"
    [class.ui-stepper-vertical]="orientation() === 'vertical'"
    [attr.id]="id()"
  >
    <div class="ui-stepper-layout">

      <!-- Step navigation -->
      <div
        class="ui-stepper-header"
        role="list"
        aria-label="Progress steps"
      >
        @for (step of steps(); track step.id; let i = $index) {
          <div
            class="ui-stepper-header-item"
            role="listitem"
            [class.ui-stepper-header-active]="isStepActive(i)"
            [class.ui-stepper-header-completed]="isStepCompleted(step, i)"
            [class.ui-stepper-header-error]="step.error"
            [class.ui-stepper-header-disabled]="isStepDisabled(i)"
          >
            <button
              type="button"
              class="ui-stepper-step-button"
              [id]="getStepId(step.id)"
              [disabled]="isStepDisabled(i)"
              [attr.aria-current]="isStepActive(i) ? 'step' : null"
              [attr.aria-controls]="getPanelId(step.id)"
              [attr.aria-label]="
                'Step ' + (i + 1) + ': ' + step.label +
                (isStepCompleted(step, i) ? ', completed' : '') +
                (step.error ? ', has error' : '')
              "
              (click)="selectStep(i)"
            >
              <span class="ui-stepper-indicator">
                @if (step.error) {
                  <span aria-hidden="true">!</span>
                } @else if (isStepCompleted(step, i)) {
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                      d="m5 12 4 4L19 6"
                      stroke="currentColor"
                      stroke-width="2.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                } @else if (showStepNumbers()) {
                  {{ i + 1 }}
                } @else {
                  <span class="ui-stepper-indicator-dot"></span>
                }
              </span>

              <span class="ui-stepper-step-text">
                <span class="ui-stepper-step-label">
                  {{ step.label }}

                  @if (step.optional) {
                    <span class="ui-stepper-optional">
                      Optional
                    </span>
                  }
                </span>

                @if (step.description) {
                  <span class="ui-stepper-step-description">
                    {{ step.description }}
                  </span>
                }
              </span>
            </button>

            @if (i < steps().length - 1) {
              <span
                class="ui-stepper-connector"
                [class.ui-stepper-connector-completed]="
                  isStepCompleted(step, i)
                "
                aria-hidden="true"
              ></span>
            }
          </div>
        }
      </div>

      <!-- Active step content and navigation -->
      <div class="ui-stepper-main">

        @if (currentStep(); as step) {
          <section
            class="ui-stepper-content"
            [id]="getPanelId(step.id)"
            role="region"
            [attr.aria-labelledby]="getStepId(step.id)"
          >
            <div class="ui-stepper-content-inner">
              @if (getStepTemplate(step.id); as template) {
                <ng-container
                  [ngTemplateOutlet]="template"
                  [ngTemplateOutletContext]="
                    getTemplateContext(step, activeStep())
                  "
                />
              } @else if (step.content) {
                <p class="ui-stepper-default-content">
                  {{ step.content }}
                </p>
              }
            </div>
          </section>
        }

        @if (showNavigation()) {
          <div class="ui-stepper-navigation">
            <button
              type="button"
              class="ui-stepper-previous"
              [disabled]="isFirstStep()"
              (click)="previous()"
            >
              {{ previousLabel() }}
            </button>

            <button
              type="button"
              class="ui-stepper-next"
              [disabled]="!canProceed()"
              (click)="next()"
            >
              {{ isLastStep() ? completeLabel() : nextLabel() }}
            </button>
          </div>
        }

      </div>
    </div>
  </div>
}
